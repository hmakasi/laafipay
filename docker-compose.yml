services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laafipay
      POSTGRES_PASSWORD: "COde@1844"
      POSTGRES_DB: laafipay
    ports:
      - '5433:5432'
    volumes:
      - laafipay_postgres_data:/var/lib/postgresql/data

volumes:
  laafipay_postgres_data:
